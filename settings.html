<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Company settings · HCM Lite</title><link rel="stylesheet" href="css/style.css"></head>
<body><div class="layout"><aside class="sidebar" id="sidebar"></aside><main class="main"><div class="topbar"><button class="btn ghost menu-btn" id="menuBtn" aria-label="Open menu" aria-expanded="false">☰</button><h1>Company settings</h1></div><div id="pageMsg"></div>
<section class="card"><form id="settingsForm" novalidate style="max-width:480px"><label for="st-name">Company name</label><input id="st-name" type="text" ><small class="err" id="err-name"></small><label for="st-start">Office start time</label><input id="st-start" type="time" ><small class="err" id="err-officeStart"></small><label for="st-grace">Grace period (minutes)</label><input id="st-grace" type="number" min="0" max="240"><small class="err" id="err-graceMinutes"></small><label for="st-quota">Yearly leave quota (days)</label><input id="st-quota" type="number" min="0" max="365"><small class="err" id="err-leaveQuota"></small><fieldset style="border:0;padding:0;margin:10px 0"><legend><strong>Working days</strong></legend><div id="dayBoxes"></div></fieldset><button class="btn" type="submit">Save settings</button></form></section>
</main></div>
<script src="js/storage.js"></script><script src="js/auth.js"></script><script src="js/settings.js"></script><script>initSettingsPage();</script></body></html>
