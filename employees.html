<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Employees · HCM Lite</title><link rel="stylesheet" href="css/style.css"></head>
<body><div class="layout"><aside class="sidebar" id="sidebar"></aside><main class="main"><div class="topbar"><button class="btn ghost menu-btn" id="menuBtn" aria-label="Open menu" aria-expanded="false">☰</button><h1>Employees</h1></div><div id="pageMsg"></div>
<section class="card"><h2 id="formTitle">Add employee</h2><form id="empForm" novalidate><div class="grid"><div><label for="f-name">Full name</label><input id="f-name" type="text" ><small class="err" id="err-name"></small><label for="f-email">Email</label><input id="f-email" type="email" ><small class="err" id="err-email"></small><label for="f-password">Password</label><input id="f-password" type="password" autocomplete="new-password"><small class="err" id="err-password"></small></div><div><label for="f-department">Department</label><input id="f-department" type="text" list="deptList"><small class="err" id="err-department"></small><datalist id="deptList"></datalist><label for="f-salary">Monthly salary</label><input id="f-salary" type="number" min="0" step="0.01"><small class="err" id="err-salary"></small></div></div><div class="row"><button class="btn" id="saveBtn" type="submit">Add employee</button><button class="btn ghost" id="cancelEdit" type="button" hidden>Cancel</button></div></form></section><section class="card"><h2>Employee list</h2><div class="grid"><div><label for="search">Search by name or email</label><input id="search" type="search"></div><div><label for="deptFilter">Department</label><select id="deptFilter"></select></div></div><div id="empTable" style="margin-top:12px"></div></section>
</main></div>
<script src="js/storage.js"></script><script src="js/auth.js"></script><script src="js/employees.js"></script><script>initEmployeesPage();</script></body></html>
