<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>My dashboard · HCM Lite</title><link rel="stylesheet" href="css/style.css"></head>
<body><div class="layout"><aside class="sidebar" id="sidebar"></aside><main class="main"><div class="topbar"><button class="btn ghost menu-btn" id="menuBtn" aria-label="Open menu" aria-expanded="false">☰</button><h1>My dashboard</h1></div><div id="pageMsg"></div>
<p class="muted" id="empInfo"></p><div class="grid"><section class="card"><h2>Today</h2><p id="todayStatus"></p><p class="muted" id="todayTimes"></p><div class="row"><button class="btn" id="checkInBtn">Check in</button><button class="btn ghost" id="checkOutBtn">Check out</button></div></section><section class="card"><h2>Leave balance</h2><div class="big" id="balance">0</div><p class="muted" id="quotaNote"></p><p>Absent days this month: <strong id="absentMonth">0</strong></p><a class="btn small" href="payslip.html">View my payslip</a></section></div><section class="card" style="margin-top:16px"><h2>My attendance</h2><div id="historyTable"></div></section><div class="grid"><section class="card"><h2>Apply for leave</h2><div id="leaveMsg"></div><form id="leaveForm" novalidate><label for="lv-type">Leave type</label><select id="lv-type"><option value="casual">Casual</option><option value="sick">Sick</option><option value="other">Other</option></select><small class="err" id="err-lv-type"></small><label for="lv-start">Start date</label><input id="lv-start" type="date" ><small class="err" id="err-lv-start"></small><label for="lv-end">End date</label><input id="lv-end" type="date" ><small class="err" id="err-lv-end"></small><label for="lv-reason">Reason</label><textarea id="lv-reason" rows="2"></textarea><small class="err" id="err-lv-reason"></small><button class="btn" type="submit">Submit request</button></form></section><section class="card"><h2>My leave requests</h2><div id="myLeaves"></div></section></div><div class="grid"><section class="card"><h2>Announcements</h2><div id="announceList"></div></section><section class="card"><h2>Smart helper</h2><div id="chatLog" aria-live="polite"></div><form id="chatForm"><label class="sr" for="chatInput">Question</label><input id="chatInput" placeholder="Ask a question…" autocomplete="off"><button class="btn" type="submit">Ask</button></form></section></div>
</main></div>
<script src="js/storage.js"></script><script src="js/auth.js"></script><script src="js/attendance.js"></script><script src="js/leave.js"></script><script src="js/announcements.js"></script><script src="js/helper.js"></script><script src="js/dashboard.js"></script><script>initEmployeePage();</script></body></html>
