<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in · HCM Lite</title><link rel="stylesheet" href="css/style.css"></head>
<body><div class="auth-wrap"><div class="auth-card"><h1>HCM Lite</h1><section id="setupView" hidden><h2>Set up your company</h2><p class="muted">First time here? Create the company and the Admin account.</p><div id="setupMsg"></div><form id="setupForm" novalidate><label for="s-company">Company name</label><input id="s-company" type="text" ><small class="err" id="err-s-companyName"></small><label for="s-name">Admin name</label><input id="s-name" type="text" ><small class="err" id="err-s-adminName"></small><label for="s-email">Admin email</label><input id="s-email" type="email" ><small class="err" id="err-s-email"></small><label for="s-password">Admin password</label><input id="s-password" type="password" autocomplete="new-password"><small class="err" id="err-s-password"></small><div class="row"><button class="btn" type="submit">Create company</button></div></form></section><section id="loginView" hidden><h2>Log in</h2><div id="loginMsg"></div><form id="loginForm" novalidate><label for="l-email">Email</label><input id="l-email" type="email" ><small class="err" id="err-l-email"></small><label for="l-password">Password</label><input id="l-password" type="password" ><small class="err" id="err-l-password"></small><div class="row"><button class="btn" type="submit">Log in</button></div></form></section></div></div><script src="js/storage.js"></script><script src="js/auth.js"></script><script>initIndexPage();</script></body></html>
