<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin dashboard · HCM Lite</title><link rel="stylesheet" href="css/style.css"></head>
<body><div class="layout"><aside class="sidebar" id="sidebar"></aside><main class="main"><div class="topbar"><button class="btn ghost menu-btn" id="menuBtn" aria-label="Open menu" aria-expanded="false">☰</button><h1>Admin dashboard</h1></div><div id="pageMsg"></div>
<div class="stats" id="stats"></div><div class="grid"><section class="card"><h2>Attendance by department (checked in today)</h2><div id="deptChart"></div></section><section class="card"><h2>Recent attendance</h2><div id="recentTable"></div></section></div><div class="grid" style="margin-top:16px"><section class="card"><h2>Announcements</h2><form id="announceForm" novalidate><label for="an-title">Title</label><input id="an-title" type="text" ><small class="err" id="err-an-title"></small><label for="an-message">Message</label><textarea id="an-message" rows="2"></textarea><small class="err" id="err-an-message"></small><div class="row"><button class="btn" type="submit">Post announcement</button></div></form><hr><div id="announceList"></div></section><section class="card"><h2>Smart helper</h2><div id="chatLog" aria-live="polite"></div><form id="chatForm"><label class="sr" for="chatInput">Question</label><input id="chatInput" placeholder="Ask a question…" autocomplete="off"><button class="btn" type="submit">Ask</button></form></section></div>
</main></div>
<script src="js/storage.js"></script><script src="js/auth.js"></script><script src="js/attendance.js"></script><script src="js/leave.js"></script><script src="js/announcements.js"></script><script src="js/helper.js"></script><script src="js/dashboard.js"></script><script>initAdminPage();</script></body></html>
